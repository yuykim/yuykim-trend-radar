name: Daily radar
on:
  schedule:
    - cron: '0 22 * * *'
  workflow_dispatch:

concurrency:
  group: daily-radar
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      RADAR_COLLECTOR_STATE: data/collector-state.db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: |
          python -m pip install -r backend/requirements.lock -e ./backend 'pytest>=8,<9'
          npm ci --prefix frontend
          cd frontend
          npx playwright install --with-deps chromium
      - name: Test
        run: |
          python -m pytest -q
          npm --prefix frontend test -- --run
          npm --prefix frontend run build
          npm --prefix frontend run test:e2e
      - name: Collect, analyze, summarize and export
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -m radar.cli run --out frontend/public/data
      - name: Persist batch state even if a later step fails
        if: ${{ always() && !cancelled() }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for db in data/radar.db data/collector-state.db; do
            if [ -f "$db" ]; then git add -f -- "$db"; fi
          done
          git add -- frontend/public/data
          if ! git diff --cached --quiet; then
            git commit -m 'chore: update daily radar data and checkpoints'
            git push origin HEAD:main
          fi
      - name: Build site
        run: npm --prefix frontend run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
