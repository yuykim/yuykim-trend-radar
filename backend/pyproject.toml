[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yuykim-trend-radar"
version = "0.1.0"
description = "Evidence-first personal Physical AI research trend radar"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7,<3", "PyYAML>=6.0,<7"]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[tool.setuptools.packages.find]
where = ["."]
include = ["radar*"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["tests"]
